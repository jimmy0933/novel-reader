name: Android APK · latest release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novel-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, sign and release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Prepare signing key from GitHub Actions Secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/novel-reader-release.jks"
            echo "NOVELREADER_KEYSTORE_PATH=$RUNNER_TEMP/novel-reader-release.jks" >> "$GITHUB_ENV"
            echo "NOVELREADER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "NOVELREADER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "NOVELREADER_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Using GitHub Actions signing key."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing Secrets unavailable; building a debug-signed release APK (not upgrade-compatible with key-signed installs)."
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify and stage APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          if [[ "${{ steps.signing.outputs.mode }}" == "release" ]]; then
            NAME="NovelReader-v${VERSION}-signed.apk"
          else
            NAME="NovelReader-v${VERSION}-debug-signed.apk"
          fi
          SRC=app/build/outputs/apk/release/app-release.apk
          test -s "$SRC"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$SRC"
          cp "$SRC" "dist/$NAME"
          sha256sum "dist/$NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelReader-Release-APK
          path: dist/*.apk

      - name: Publish newest release, remove previous releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          # Novel Reader v${VERSION}

          Signing mode: **${SIGN_MODE}**.
          EOF
          if [[ "$SIGN_MODE" != "release" ]]; then
            printf '\n**Warning:** debug-signed APK. Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD Secrets for stable release signing.\n' >> "$RUNNER_TEMP/notes.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --title "Novel Reader v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "$TAG" dist/*.apk --target "$GITHUB_SHA" --title "Novel Reader v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' | while IFS= read -r old; do
            if [[ -n "$old" && "$old" != "$TAG" ]]; then
              gh release delete "$old" --yes --cleanup-tag
            fi
          done

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
